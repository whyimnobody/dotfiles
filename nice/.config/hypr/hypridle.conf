# Idle policy for Asura: lock the session, then turn monitors off.
# Do not start hypridle yet. `hyprctl dispatch dpms off` previously crashed
# this Hyprland session. Uncomment `exec-once = hypridle` in hyprland.lua
# only after DPMS is known to be safe.
#
# Suspend is intentionally omitted. SSH, Mosh, Mutagen, and the 1Password
# bridge must keep running while the machine is locked.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 900
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
