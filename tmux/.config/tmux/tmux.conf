# BIND CTRL-SPACE AS PRIMARY CHORD
set-option -g prefix C-space
# set-option -g prefix2 C-b
# OPTIONS
set -g allow-passthrough on
set -s extended-keys on
set -s set-clipboard external
# Set true colour
set -g default-terminal "tmux-256color"
set -s terminal-features[99] "xterm*:RGB:clipboard:extkeys"
# Mosh 1.4 only forwards OSC 52 writes targeting the standard clipboard.
set -s terminal-overrides[99] "xterm*:Ms=\\E]52;c;%p2%s\\007"
# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
# Set mouse mode on for seamless scrolling
# set -g mouse on # Absolutely wrecked my vim experience

set -g mouse on
bind -n WheelUpPane if-shell -F '#{m/ri:^(agent|codex)$:#{pane_current_command}}' \
  'copy-mode -e' \
  'if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode"'

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window
# set vi-mode
set-window-option -g mode-keys vi
# Open split panes in PWD
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Set plugin install path
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"

# PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# THEME
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Load the theme before composing the status line. TPM loads the remaining
# plugins below and replaces the continuum interpolation afterwards.
run '~/.local/share/tmux/plugins/tmux/catppuccin.tmux'
source ~/.config/tmux/continuum.conf

set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_continuum}"

# Set automatic session saving to 10 minutes
set -g @resurrect-processes 'pnpm node "mix phx.server" uv'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @continuum-boot 'on'
set -g @mighty-scroll-fallback-mode 'by-line'

# Initialize TPM before final bindings that must take precedence over plugins.
run '~/.local/share/tmux/plugins/tpm/tpm'

# Keep copy bindings after plugin initialization so they cannot be overwritten.
# Pass the session, not #{client_tty}: copy-pipe can expand the client pts as
# empty, and Mosh reconnects allocate a new pts. copy-osc52 lists live clients.
osc52_copy="~/.config/tmux/copy-osc52 '#{session_name}'"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$osc52_copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$osc52_copy"
bind-key -T copy-mode-vi D send-keys -X copy-pipe-end-of-line-and-cancel "$osc52_copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$osc52_copy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "$osc52_copy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "$osc52_copy"
