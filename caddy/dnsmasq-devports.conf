# Resolve *.test and *.asura to this node's Tailscale IPv4.
# scripts/caddy.sh fills in __TAILSCALE_IPV4__ on install.
interface=lo
interface=tailscale0
bind-dynamic
no-dhcp-interface=lo
no-dhcp-interface=tailscale0
local=/test/
local=/asura/
address=/.test/__TAILSCALE_IPV4__
address=/.asura/__TAILSCALE_IPV4__
